# Chargé UNIQUEMENT pendant les tests : Spring Boot ajoute classpath:/config/application.yml par-dessus
# classpath:/application.yml. Ce fichier n'est ni dans le .jar ni utilisé par ./mvnw spring-boot:run.
boutique:
  security:
    jwt:
      secret: cle-de-test-uniquement-ne-jamais-utiliser-en-production
    keycloak:
      # Émetteur fictif : les tests simulent des jetons Keycloak avec jwt() sans serveur Keycloak réel
      issuer-uri: http://keycloak.test/realms/boutique
  payment:
    reconciliation:
      # Pas de tâche planifiée pendant les tests : ils déclenchent la réconciliation eux-mêmes
      enabled: false
      pending-delay: PT0S
