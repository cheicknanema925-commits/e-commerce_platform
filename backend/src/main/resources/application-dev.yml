spring:
  config:
    # Lit les identifiants de la base dans le .env à la racine du dépôt (le même que docker compose)
    import: optional:file:../.env[.properties]
  web:
    error:
      # En développement : message et champs invalides visibles pour déboguer avec curl
      include-message: always
      include-binding-errors: always

# En développement, le site tourne en http://localhost : le cookie du refresh token ne peut pas exiger HTTPS
boutique:
  security:
    refresh-cookie:
      secure: false

# Swagger UI : http://localhost:8080/swagger-ui.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    # Affiche chaque requête SQL envoyée par Hibernate (utile pour repérer le problème N+1)
    org.hibernate.SQL: debug
