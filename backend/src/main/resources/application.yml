spring:
  application:
    name: boutique-api
  datasource:
    # Valeurs lues dans les variables d'environnement (ou le .env en profil dev), jamais écrites ici
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway crée le schéma ; Hibernate vérifie seulement que les entités lui correspondent
      ddl-auto: validate
    # Aucune requête SQL après la fin du service : les DTO sont construits dans la transaction
    open-in-view: false
  data:
    web:
      pageable:
        # Un client ne peut pas demander 1 million de produits d'un coup
        max-page-size: 100
  web:
    error:
      # Jamais de stack trace dans les réponses HTTP, quel que soit le profil
      include-stacktrace: never

boutique:
  security:
    jwt:
      # Clé de signature des jetons (32 caractères minimum), lue dans l'environnement : jamais dans le code.
      # Vide = l'application refuse de démarrer (validée par SecurityProperties)
      secret: ${JWT_SECRET:}
      issuer: boutique-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    rate-limit:
      # Par minute et par adresse IP, sur /api/auth/login et /api/auth/register
      requests-per-minute: 10
    admin:
      # Premier compte ADMIN créé au démarrage s'il n'existe pas (vide = aucun compte créé)
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    keycloak:
      # Ex. http://localhost:8180/realms/boutique ; vide = Keycloak désactivé (seuls nos propres jetons sont acceptés)
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      # Les jetons Keycloak doivent contenir cette audience (claim « aud »)
      audience: boutique-api

  payment:
    # fake (développement, tests) ou paydunya. Le faux fournisseur est refusé avec le profil prod.
    provider: ${PAYMENT_PROVIDER:fake}
    # Adresse publique de l'API (PayDunya y envoie ses notifications) et du frontend (pages de retour)
    public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    store-name: Boutique
    reconciliation:
      enabled: true
      # Toutes les 5 minutes, on revérifie les paiements en attente depuis plus de 10 minutes
      interval: PT5M
      pending-delay: PT10M
    paydunya:
      # test = bac à sable (aucun argent réel), live = production
      mode: ${PAYDUNYA_MODE:test}
      master-key: ${PAYDUNYA_MASTER_KEY:}
      private-key: ${PAYDUNYA_PRIVATE_KEY:}
      token: ${PAYDUNYA_TOKEN:}
    fake:
      # Secret du faux fournisseur uniquement (jamais utilisé en production)
      webhook-secret: secret-du-faux-fournisseur

# Documentation de l'API désactivée par défaut : on choisit explicitement où l'exposer (activée en dev)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
