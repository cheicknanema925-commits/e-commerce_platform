spring:
  application:
    name: boutique-api
  datasource:
    # Valeurs lues dans les variables d'environnement (ou le .env en profil dev), jamais écrites ici
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      # Flyway crée le schéma ; Hibernate vérifie seulement que les entités lui correspondent
      ddl-auto: validate
    # Aucune requête SQL après la fin du service : les DTO sont construits dans la transaction
    open-in-view: false
  data:
    web:
      pageable:
        # Un client ne peut pas demander 1 million de produits d'un coup
        max-page-size: 100
  web:
    error:
      # Jamais de stack trace dans les réponses HTTP, quel que soit le profil
      include-stacktrace: never
  ai:
    ollama:
      # Modèles locaux en développement (Ollama) ; un autre fournisseur se branche par configuration
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        model: ${OLLAMA_CHAT_MODEL:llama3.2:3b-instruct-q4_K_M}
        # Peu de fantaisie : un assistant de boutique doit être précis et régulier
        temperature: 0.2
      embedding:
        model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
    chat:
      memory:
        repository:
          jdbc:
            # Table créée par Flyway (V16), jamais par Spring AI
            initialize-schema: never
    vectorstore:
      pgvector:
        # Table et index créés par Flyway (V16) ; 768 = taille des vecteurs de nomic-embed-text
        initialize-schema: false
        dimensions: 768
        id-type: text
        index-type: hnsw
        distance-type: cosine-distance
  servlet:
    multipart:
      # Photos des produits : 5 Mo par fichier (au-delà : 413), elles sont ensuite réduites par ImageProcessor
      max-file-size: 5MB
      max-request-size: 6MB

boutique:
  security:
    jwt:
      # Clé de signature des jetons (32 caractères minimum), lue dans l'environnement : jamais dans le code.
      # Vide = l'application refuse de démarrer (validée par SecurityProperties)
      secret: ${JWT_SECRET:}
      issuer: boutique-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    login:
      max-failed-attempts: 5
      lock-duration: 15m
    rate-limit:
      # Par minute et par adresse IP, sur /api/auth/login et /api/auth/register
      requests-per-minute: 10
    admin:
      # Premier compte ADMIN créé au démarrage s'il n'existe pas (vide = aucun compte créé)
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    refresh-cookie:
      # Cookie du refresh token réservé à HTTPS (sûr par défaut, désactivé en dev seulement)
      secure: true
    keycloak:
      # Ex. http://localhost:8180/realms/boutique ; vide = Keycloak désactivé (seuls nos propres jetons sont acceptés)
      issuer-uri: ${KEYCLOAK_ISSUER_URI:}
      # Les jetons Keycloak doivent contenir cette audience (claim « aud »)
      audience: boutique-api

  catalog:
    # Dossier des photos des produits (relatif au dossier de lancement ; en production, un volume Docker)
    images-dir: ${IMAGES_DIR:./data/images}

  pricing:
    expiry:
      # Fin des promotions : chaque minute, les prix d'avant sont rétablis
      enabled: true
      interval: PT1M

  agent:
    # Garde-fous de la boucle : au plus 6 appels d'outils par message, 3 fois le même outil
    max-tool-calls: 6
    max-calls-per-tool: 3
    # Mémoire : les 20 derniers messages de la conversation sont renvoyés au modèle
    memory-messages: 20
    # Une action proposée doit être confirmée dans les 15 minutes, sinon elle expire
    proposal-ttl: 15m
    # Limite par utilisateur (un modèle coûte cher en calcul : pas d'abus)
    messages-per-minute: 20

  payment:
    # fake (développement, tests) ou paydunya. Le faux fournisseur est refusé avec le profil prod.
    provider: ${PAYMENT_PROVIDER:fake}
    # Adresse publique de l'API (PayDunya y envoie ses notifications) et du frontend (pages de retour)
    public-api-url: ${PUBLIC_API_URL:http://localhost:8080}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    store-name: Boutique
    reconciliation:
      enabled: true
      # Toutes les 5 minutes, on revérifie les paiements en attente depuis plus de 10 minutes
      interval: PT5M
      pending-delay: PT10M
    paydunya:
      # test = bac à sable (aucun argent réel), live = production
      mode: ${PAYDUNYA_MODE:test}
      master-key: ${PAYDUNYA_MASTER_KEY:}
      private-key: ${PAYDUNYA_PRIVATE_KEY:}
      token: ${PAYDUNYA_TOKEN:}
    fake:
      # Secret du faux fournisseur uniquement (jamais utilisé en production)
      webhook-secret: secret-du-faux-fournisseur

# Documentation de l'API désactivée par défaut : on choisit explicitement où l'exposer (activée en dev)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
